name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  typecheck-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # src/routeTree.gen.ts is committed; the typecheck below is what validates
      # it (a corrupt/stale tree surfaces as unassignable createFileRoute paths).
      - name: Typecheck (catches admin booking RPC / update payload mismatches)
        run: bunx tsc --noEmit

      # Aggregate script in package.json — covers all 18 regression suites,
      # including the WhatsApp ones previously listed individually here.
      - name: Regression tests
        run: bun run test:wa-refactor

      - name: Lint
        run: bun run lint
