name: Apply WA formatter refactor

on:
  push:
    branches:
      - agent/extract-wa-availability-formatters
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply-refactor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/extract-wa-availability-formatters
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Apply guarded source transform
        run: node scripts/apply-availability-formatter-refactor.mjs

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate route tree
        run: node scratch/generate_routes.js

      - name: Typecheck
        run: bunx tsc --noEmit

      - name: Message parser regressions
        run: bun run test:message-parsers

      - name: Availability formatter regressions
        run: bun run test:wa-formatters

      - name: Lint
        run: bun run lint

      - name: Commit refactor and remove temporary automation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/services/wa-autoreply.service.ts
          git rm scripts/apply-availability-formatter-refactor.mjs
          git rm .github/workflows/apply-wa-formatter-refactor.yml
          git commit -m "refactor(wa): extract availability formatters [formatter-refactor-applied]"
          git push origin HEAD:agent/extract-wa-availability-formatters
